<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/qamera-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Qamera Stage Player — Live Camera Projector & Event Video Player.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Qamera Stage Player">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Qamera Stage Player</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #07070B;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #qamera-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, rgba(255, 215, 64, 0.12), #07070B 62%);
      transition: opacity 280ms ease-out, visibility 280ms ease-out;
    }

    #qamera-splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .qamera-logo-wrap {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 215, 64, 0.35);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      margin-bottom: 18px;
      background: #12141E;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qamera-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .qamera-title {
      color: #F8FAFC;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin: 0 0 6px 0;
    }

    .qamera-sub {
      color: rgba(255, 255, 255, 0.56);
      font-size: 13px;
      margin: 0 0 22px 0;
    }

    .qamera-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 215, 64, 0.2);
      border-top-color: #FFD740;
      border-radius: 50%;
      animation: qamera-spin 0.8s linear infinite;
    }

    @keyframes qamera-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="qamera-splash" aria-label="Loading Qamera Stage Player">
    <div class="qamera-logo-wrap">
      <img src="favicon.png" alt="Qamera" onerror="this.style.display='none'" />
    </div>
    <p class="qamera-title">Qamera Stage Player</p>
    <p class="qamera-sub">Memuat proyektor kamera...</p>
    <div class="qamera-spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('qamera-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 320);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
